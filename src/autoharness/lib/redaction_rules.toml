# egress redline rule set -- the single source shared by CAP egress and the LED evidence exit (config points to it, redact consumes it).
# Each entry = one named regex; redact replaces the whole match with [REDACTED:<category>:<name>].
# Over-redaction is the safe side (better to drop too much); add new rules here alone, do not scatter them across the code.

[[secret]]
name = "aws_access_key_id"
pattern = '''AKIA[0-9A-Z]{16}'''

[[secret]]
name = "private_key_block"
# the whole block, not just its header: through its END when that comes before another BEGIN or the
# next transcript record (a line starting `{`), within 8 KiB; otherwise (a record clipped mid-key)
# the rest of the header's line, which in a transcript record holds the JSON-escaped body, plus the
# whole lines that follow it as long as they look like a PEM body: base64, the Proc-Type / DEK-Info
# headers of a legacy encrypted key, blank lines; a base64 line may end in capture's `...[truncated]` mark
pattern = '''-----BEGIN [A-Z ]*PRIVATE KEY-----(?:(?:(?!-----BEGIN |\n\{)[\s\S]){0,8192}?-----END [A-Z ]*PRIVATE KEY-----|.*(?:\r?\n(?:[A-Za-z0-9+/=]+(?:\.\.\.\[truncated\])?|(?:Proc-Type|DEK-Info):[^\r\n]*|[ \t]*)(?![^\r\n]))*)'''

[[secret]]
name = "github_token"
pattern = '''gh[posru]_[A-Za-z0-9]{20,}'''

[[secret]]
name = "slack_token"
pattern = '''xox[abprs]-[A-Za-z0-9-]{10,}'''

[[secret]]
name = "bearer_token"
pattern = '''(?i)bearer\s+[A-Za-z0-9._-]{20,}'''

[[secret]]
name = "api_key_assignment"
pattern = '''(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*['"]?[A-Za-z0-9._\-/+]{12,}'''

[[pii]]
name = "email"
pattern = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''

[[pii]]
name = "ssn"
pattern = '''(?<!\d)\d{3}-\d{2}-\d{4}(?!\d)'''

[[pii]]
name = "us_phone"
pattern = '''(?<!\d)(\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}(?!\d)'''

[[pii]]
name = "credit_card"
pattern = '''(?<!\d)(?:\d[ -]?){13,16}(?!\d)'''
# luhn gate: 13-16 digit runs failing the checksum (snowflake ids, ms timestamps, numeric pks)
# stay in the stream as evidence; real card numbers pass by construction.
validate = "luhn"
